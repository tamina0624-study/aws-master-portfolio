name: Image CI

# 実行トリガー: PR 時のビルド検証・脆弱性スキャン（本番 push は image-cd.yml が担当）
on:
  pull_request:
    paths:
      - "projects/17-cicd-pipeline/app/**"
      - "projects/17-cicd-pipeline/Dockerfile"
      - "projects/17-cicd-pipeline/requirements.txt"
      - ".github/workflows/image-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Trivy ファイルシステムスキャン（ビルド前・フレームワーク問わず依存関係を検査）
  # Python: requirements.txt / Node.js: package.json / Go: go.mod / Java: pom.xml など自動検出
  trivy-fs-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: projects/17-cicd-pipeline
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # Docker イメージビルド（push なし）
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: projects/17-cicd-pipeline
          push: false
          tags: app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/app-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: /tmp/app-image.tar
          retention-days: 1

  # Trivy によるイメージ脆弱性スキャン（CRITICAL/HIGH で失敗）
  trivy-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: app-image
          path: /tmp

      - name: Load image and set IMAGE_URI
        run: |
          docker load --input /tmp/app-image.tar
          echo "IMAGE_URI=app:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
