name: CI

on:
  pull_request:
    paths:
      - "projects/17-cicd-pippeline/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  python-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/17-cicd-pippeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy .

  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/17-cicd-pippeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage gate
        run: python -m pytest

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/17-cicd-pippeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Python dependency audit
        run: python -m pip_audit -r requirements-dev.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform scan (checkov)
        run: python -m checkov.main -d terraform --framework terraform --quiet

  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/17-cicd-pippeline/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend=false -input=false -no-color

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Configure AWS credentials (optional)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Terraform plan
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: terraform plan -input=false -no-color

      - name: Skip plan note
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        run: echo "AWS_ROLE_ARN is not set. Terraform plan was skipped."
