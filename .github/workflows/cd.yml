name: CD

on:
  push:
    branches:
      - main
    paths:
      - "projects/17-cicd-pippeline/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: projects/17-cicd-pippeline/terraform

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_VAR_environment: dev
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Terraform init
        run: terraform init -input=false -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply (dev auto)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: terraform apply -input=false -no-color -auto-approve tfplan

      - name: Health check (dev)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        working-directory: projects/17-cicd-pippeline
        env:
          S3_BUCKET_NAME: cicd-learning-sample-app-dev-638892640336
          ENVIRONMENT: dev
        run: |
          pip install boto3
          python scripts/health_check.py

      - name: Skip deployment note
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        run: echo "AWS_ROLE_ARN is not set for dev environment. Deployment was skipped."

  deploy-stg:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: stg
    env:
      TF_VAR_environment: stg
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Terraform init
        run: terraform init -input=false -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply (stg after approval)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: terraform apply -input=false -no-color -auto-approve tfplan

      - name: Health check (stg)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        working-directory: projects/17-cicd-pippeline
        env:
          S3_BUCKET_NAME: cicd-learning-sample-app-stg-638892640336
          ENVIRONMENT: stg
        run: |
          pip install boto3
          python scripts/health_check.py

      - name: Skip deployment note
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        run: echo "AWS_ROLE_ARN is not set for stg environment. Deployment was skipped."

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-stg
    environment: prod
    env:
      TF_VAR_environment: prod
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Terraform init
        run: terraform init -input=false -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply (prod after approval)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: terraform apply -input=false -no-color -auto-approve tfplan

      - name: Health check (prod)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        working-directory: projects/17-cicd-pippeline
        env:
          S3_BUCKET_NAME: cicd-learning-sample-app-prod-638892640336
          ENVIRONMENT: prod
        run: |
          pip install boto3
          python scripts/health_check.py

      - name: Skip deployment note
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        run: echo "AWS_ROLE_ARN is not set for prod environment. Deployment was skipped."
