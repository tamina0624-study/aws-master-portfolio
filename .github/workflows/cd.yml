name: CD

# 実行トリガー: main への push（対象パスのみ）または手動実行
on:
  push:
    branches:
      - main
    paths:
      - "projects/17-cicd-pippeline/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

# OIDC で AWS に接続するための最小権限
permissions:
  contents: read
  id-token: write

# Terraform コマンドの既定実行ディレクトリ
defaults:
  run:
    working-directory: projects/17-cicd-pippeline/terraform

jobs:
  # dev 環境へ自動デプロイ（CD パイプラインの開始点）
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_VAR_environment: dev
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        # AWS_ROLE_ARN が設定されている場合のみ AWS 認証を有効化
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Terraform init
        run: terraform init -input=false -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        # 認証情報がある場合のみ plan/apply を実行
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply (dev auto)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: terraform apply -input=false -no-color -auto-approve tfplan

      - name: Health check (dev)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        working-directory: projects/17-cicd-pippeline
        env:
          S3_BUCKET_NAME: cicd-learning-sample-app-dev-638892640336
          ENVIRONMENT: dev
        run: |
          pip install boto3
          python scripts/health_check.py

      - name: Skip deployment note
        # ロール未設定時は明示的にスキップ理由を出力
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        run: echo "AWS_ROLE_ARN is not set for dev environment. Deployment was skipped."

