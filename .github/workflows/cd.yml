name: CD

# 実行トリガー: main へのpush（対象パスのみ）または手動実行
on:
  push:
    branches:
      - main
    paths:
      - "projects/17-cicd-pippeline/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

# OIDC で AWS に接続するための最小権限
permissions:
  contents: read
  id-token: write

# Terraform コマンドの既定実行ディレクトリ
defaults:
  run:
    working-directory: projects/17-cicd-pippeline/terraform

jobs:
  # dev 環境デプロイ
  deploy-dev:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: projects/17-cicd-pippeline

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Init (Dev)
        run: terraform init
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Validate
        run: terraform validate
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Import existing S3 bucket (Dev)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="cicd-learning-sample-app-dev-${ACCOUNT_ID}"

          echo "Checking if bucket ${BUCKET_NAME} exists..."
          if ! aws s3 ls "s3://${BUCKET_NAME}" 2>&1 | grep -q 'NoSuchBucket'; then
            echo "✓ Bucket exists in AWS"
            echo "→ Removing any existing state references..."
            terraform state rm aws_s3_bucket.app_bucket || true

            echo "→ Importing bucket to Terraform state..."
            terraform import aws_s3_bucket.app_bucket "${BUCKET_NAME}" || echo "⚠ Import failed"
          else
            echo "✓ Bucket does not exist, will create new one"
          fi
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Plan (Dev)
        run: terraform plan -var="environment=dev"
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Apply (Dev)
        run: terraform apply -var="environment=dev" -auto-approve
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          echo "s3_bucket_name=$S3_BUCKET" >> $GITHUB_OUTPUT
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Health Check
        run: |
          python scripts/health_check.py
        working-directory: projects/17-cicd-pippeline
        env:
          S3_BUCKET_NAME: ${{ steps.tf-outputs.outputs.s3_bucket_name }}
        if: ${{ vars.AWS_ROLE_ARN != '' }}

  # stg 環境デプロイ
  deploy-stg:
    environment: stg
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: projects/17-cicd-pippeline

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Init (Stg)
        run: terraform init
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Plan (Stg)
        run: terraform plan -var="environment=stg"
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Import existing S3 bucket (Stg)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="cicd-learning-sample-app-stg-${ACCOUNT_ID}"

          echo "Checking if bucket ${BUCKET_NAME} exists..."
          if ! aws s3 ls "s3://${BUCKET_NAME}" 2>&1 | grep -q 'NoSuchBucket'; then
            echo "✓ Bucket exists in AWS"
            echo "→ Removing any existing state references..."
            terraform state rm aws_s3_bucket.app_bucket || true

            echo "→ Importing bucket to Terraform state..."
            terraform import aws_s3_bucket.app_bucket "${BUCKET_NAME}" || echo "⚠ Import failed"
          else
            echo "✓ Bucket does not exist, will create new one"
          fi
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Apply (Stg)
        run: terraform apply -var="environment=stg" -auto-approve
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          echo "s3_bucket_name=$S3_BUCKET" >> $GITHUB_OUTPUT
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Health Check
        run: |
          python scripts/health_check.py
        working-directory: projects/17-cicd-pippeline
        env:
          S3_BUCKET_NAME: ${{ steps.tf-outputs.outputs.s3_bucket_name }}
        if: ${{ vars.AWS_ROLE_ARN != '' }}

  # prod 環境デプロイ
  deploy-prod:
    environment: prod
    runs-on: ubuntu-latest
    needs: deploy-stg
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: projects/17-cicd-pippeline

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Init (Prod)
        run: terraform init
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Plan (Prod)
        run: terraform plan -var="environment=prod"
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Import existing S3 bucket (Prod)
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="cicd-learning-sample-app-prod-${ACCOUNT_ID}"

          echo "Checking if bucket ${BUCKET_NAME} exists..."
          if ! aws s3 ls "s3://${BUCKET_NAME}" 2>&1 | grep -q 'NoSuchBucket'; then
            echo "✓ Bucket exists in AWS"
            echo "→ Removing any existing state references..."
            terraform state rm aws_s3_bucket.app_bucket || true

            echo "→ Importing bucket to Terraform state..."
            terraform import aws_s3_bucket.app_bucket "${BUCKET_NAME}" || echo "⚠ Import failed"
          else
            echo "✓ Bucket does not exist, will create new one"
          fi
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Apply (Prod)
        run: terraform apply -var="environment=prod" -auto-approve
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          echo "s3_bucket_name=$S3_BUCKET" >> $GITHUB_OUTPUT
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Health Check
        run: |
          python scripts/health_check.py
        working-directory: projects/17-cicd-pippeline
        env:
          S3_BUCKET_NAME: ${{ steps.tf-outputs.outputs.s3_bucket_name }}
        if: ${{ vars.AWS_ROLE_ARN != '' }}
