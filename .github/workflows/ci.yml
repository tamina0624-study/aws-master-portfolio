name: CI

# 実行トリガー: push / PR（対象パスのみ）または手動実行
on:
  push:
    branches:
      - main
      - develop
    paths:
      - "projects/17-cicd-pipeline/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "projects/17-cicd-pipeline/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# セキュリティスキャンで必要な最小権限（OIDC 想定）
permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  # Python コード品質チェック（Lint/Format/型チェック）
  python-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/17-cicd-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy .

  # Python テスト実行（失敗時は PR をブロック）
  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/17-cicd-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage gate
        run: python -m pytest

  # セキュリティ関連スキャン（依存関係・シークレット・Terraform）
  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/17-cicd-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.12' }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Python dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.2"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan (gitleaks detect)
        run: gitleaks detect --source . --no-git --verbose

      - name: Terraform scan (checkov)
        run: python -m checkov.main -d terraform --framework terraform --quiet

  # Terraform の静的検証と（任意）plan 実行
  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/17-cicd-pipeline/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend=false -input=false -no-color

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Configure AWS credentials (optional)
        # AWS_ROLE_ARN があるときだけ plan 用の認証を設定
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Terraform plan
        # 認証情報がない環境では plan をスキップ
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          PLAN_EXIT_CODE=$?
          set -e

          if [ "$PLAN_EXIT_CODE" -eq 0 ]; then
            echo "No Terraform changes detected."
          elif [ "$PLAN_EXIT_CODE" -eq 1 ]; then
            echo "Terraform plan failed."
            exit 1
          elif [ "$PLAN_EXIT_CODE" -eq 2 ]; then
            echo "Terraform changes detected. Checking for destructive actions..."
            terraform show -json tfplan > tfplan.json

            DESTRUCTIVE_COUNT=$(jq '[.resource_changes[]? | select(any(.change.actions[]; . == "delete"))] | length' tfplan.json)

            if [ "$DESTRUCTIVE_COUNT" -gt 0 ]; then
              echo "Destructive Terraform changes detected (delete/replace). Failing CI."
              jq -r '.resource_changes[]? | select(any(.change.actions[]; . == "delete")) | "- \(.address): \(.change.actions | join(","))"' tfplan.json
              exit 1
            fi

            echo "Only non-destructive changes detected. CI will continue."
          else
            echo "Unexpected terraform plan exit code: $PLAN_EXIT_CODE"
            exit "$PLAN_EXIT_CODE"
          fi

      - name: Skip plan note
        # なぜ plan を実行しなかったかをログに残す
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        run: echo "AWS_ROLE_ARN is not set. Terraform plan was skipped."

  # CodeQL による SAST（コードレベルの脆弱性検出）
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    defaults:
      run:
        working-directory: projects/17-cicd-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
