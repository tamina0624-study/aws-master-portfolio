name: CD

# 実行トリガー: main へのpush（対象パスのみ）または手動実行
on:
  push:
    branches:
      - main
    paths:
      - "projects/17-cicd-pippeline/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

# OIDC で AWS に接続するための最小権限
permissions:
  contents: read
  id-token: write

# Terraform コマンドの既定実行ディレクトリ
defaults:
  run:
    working-directory: projects/17-cicd-pippeline/terraform

jobs:
  # dev 環境デプロイ
  deploy-dev:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: projects/17-cicd-pippeline

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Init (Dev)
        run: terraform init
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Validate
        run: terraform validate
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Set Terraform Exempt Principals (Dev)
        run: |
          ROLE_ARN="${{ vars.AWS_ROLE_ARN }}"
          ACCOUNT_ID=$(echo "$ROLE_ARN" | cut -d: -f5)
          ROLE_NAME="${ROLE_ARN##*/}"
          ASSUMED_ROLE_ARN="arn:aws:sts::${ACCOUNT_ID}:assumed-role/${ROLE_NAME}/*"
          echo "TF_VAR_ip_restriction_exempt_principal_arns=[\"${ROLE_ARN}\",\"${ASSUMED_ROLE_ARN}\"]" >> "$GITHUB_ENV"
          echo "TF_VAR_kms_admin_principal_arns=[\"${ROLE_ARN}\"]" >> "$GITHUB_ENV"
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Import EC2 Test Resources (Dev)
        run: |
          set -euo pipefail
          export TF_VAR_create_ec2_test=true

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          S3_BUCKET_NAME="cicd-learning-sample-app-dev-${ACCOUNT_ID}"
          VPC_TAG_NAME="sample-app-ec2-test-vpc"
          SUBNET_TAG_NAME="sample-app-ec2-test-subnet"
          INSTANCE_TAG_NAME="sample-app-destroy-test"
          SG_NAME="cicd-learning-sample-app-dev-ec2-test-sg"
          FLOW_LOGS_ROLE_NAME="cicd-learning-sample-app-dev-flowlogs-role"
          INSTANCE_ROLE_NAME="cicd-learning-sample-app-dev-ec2-test-instance-role"
          INSTANCE_PROFILE_NAME="cicd-learning-sample-app-dev-ec2-test-instance-profile"
          KMS_DESCRIPTION="KMS key for EC2 test VPC flow logs v4"

          if terraform state list 2>/dev/null | grep -q '^aws_s3_bucket.app_bucket\[0\]$'; then
            echo "S3 bucket already exists in state."
          else
            BUCKET_EXISTS=$(aws s3api list-buckets --query "length(Buckets[?Name=='${S3_BUCKET_NAME}'])" --output text)
            if [ "${BUCKET_EXISTS}" = "1" ]; then
              terraform import 'aws_s3_bucket.app_bucket[0]' "${S3_BUCKET_NAME}"
            else
              echo "No existing S3 bucket found to import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_s3_bucket_public_access_block.app_bucket_pab\[0\]$'; then
            echo "S3 public access block already exists in state."
          elif terraform state list 2>/dev/null | grep -q '^aws_s3_bucket.app_bucket\[0\]$'; then
            terraform import 'aws_s3_bucket_public_access_block.app_bucket_pab[0]' "${S3_BUCKET_NAME}" || true
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_s3_bucket_versioning.app_bucket_versioning\[0\]$'; then
            echo "S3 versioning already exists in state."
          elif terraform state list 2>/dev/null | grep -q '^aws_s3_bucket.app_bucket\[0\]$'; then
            terraform import 'aws_s3_bucket_versioning.app_bucket_versioning[0]' "${S3_BUCKET_NAME}" || true
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_s3_bucket_policy.app_bucket_policy\[0\]$'; then
            echo "S3 bucket policy already exists in state."
          elif terraform state list 2>/dev/null | grep -q '^aws_s3_bucket.app_bucket\[0\]$'; then
            terraform import 'aws_s3_bucket_policy.app_bucket_policy[0]' "${S3_BUCKET_NAME}" || true
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_kms_key.ec2_test_flow_logs_v4\[0\]$'; then
            echo "KMS key v4 already exists in state."
          elif terraform state list 2>/dev/null | grep -q '^aws_kms_key.ec2_test_flow_logs_v2\[0\]$'; then
            echo "KMS key v2 already exists in state (legacy)."
          else
            KMS_KEY_ID=$(aws kms list-keys --query 'Keys[].KeyId' --output text | tr '\t' '\n' | while read -r KEY_ID; do
              [ -n "${KEY_ID}" ] || continue
              KEY_DESC=$(aws kms describe-key --key-id "${KEY_ID}" --query 'KeyMetadata.Description' --output text 2>/dev/null || true)
              if [ "${KEY_DESC}" = "${KMS_DESCRIPTION}" ]; then
                echo "${KEY_ID}"
                break
              fi
            done)

            if [ -n "${KMS_KEY_ID}" ] && [ "${KMS_KEY_ID}" != "None" ]; then
              terraform import 'aws_kms_key.ec2_test_flow_logs_v4[0]' "${KMS_KEY_ID}"
            else
              echo "No existing KMS key found to import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_cloudwatch_log_group.ec2_test_flow_logs\[0\]$'; then
            echo "CloudWatch Log Group already exists in state."
          else
            LOG_GROUP_NAME="/aws/vpc/cicd-learning-sample-app-dev-ec2-test"
            if aws logs describe-log-groups --log-group-name-prefix "${LOG_GROUP_NAME}" --query "logGroups[?logGroupName=='${LOG_GROUP_NAME}']" | grep -q "logGroupName"; then
              terraform import 'aws_cloudwatch_log_group.ec2_test_flow_logs[0]' "${LOG_GROUP_NAME}"
            else
              echo "No existing CloudWatch Log Group found to import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_iam_role.ec2_test_flow_logs\[0\]$'; then
            echo "Flow logs IAM role already exists in state."
          else
            if aws iam get-role --role-name "${FLOW_LOGS_ROLE_NAME}" >/dev/null 2>&1; then
              terraform import 'aws_iam_role.ec2_test_flow_logs[0]' "${FLOW_LOGS_ROLE_NAME}"
            else
              echo "No existing flow logs IAM role found to import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_iam_role_policy.ec2_test_flow_logs\[0\]$'; then
            echo "Flow logs IAM role policy already exists in state."
          else
            if aws iam get-role --role-name "${FLOW_LOGS_ROLE_NAME}" >/dev/null 2>&1; then
              POLICY_NAME="cicd-learning-sample-app-dev-flowlogs-policy"
              # Check if the policy exists on the role
              if aws iam get-role-policy --role-name "${FLOW_LOGS_ROLE_NAME}" --policy-name "${POLICY_NAME}" >/dev/null 2>&1; then
                terraform import 'aws_iam_role_policy.ec2_test_flow_logs[0]' "${FLOW_LOGS_ROLE_NAME}:${POLICY_NAME}"
              else
                echo "Flow logs IAM role policy does not exist on the role, skipping import."
              fi
            else
              echo "Flow logs IAM role does not exist, skipping policy import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_flow_log.ec2_test_vpc\[0\]$'; then
            echo "VPC Flow Log already exists in state."
          else
            if terraform state list 2>/dev/null | grep -q '^aws_vpc.ec2_test\[0\]$'; then
              VPC_ID=$(terraform state show 'aws_vpc.ec2_test[0]' 2>/dev/null | awk '/^id\s+=/{print $3; exit}')
            else
              VPC_ID=$(aws ec2 describe-vpcs \
                --filters "Name=tag:Name,Values=${VPC_TAG_NAME}" "Name=tag:Environment,Values=dev" "Name=tag:Project,Values=cicd-learning" \
                --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "None")
            fi

            if [ -n "${VPC_ID}" ] && [ "${VPC_ID}" != "None" ]; then
              FLOW_LOG_ID=$(aws ec2 describe-flow-logs \
                --filter "Name=resource-id,Values=${VPC_ID}" \
                --query 'FlowLogs[0].FlowLogId' --output text 2>/dev/null || echo "None")
              if [ -n "${FLOW_LOG_ID}" ] && [ "${FLOW_LOG_ID}" != "None" ]; then
                terraform import 'aws_flow_log.ec2_test_vpc[0]' "${FLOW_LOG_ID}"
              else
                echo "No existing VPC Flow Log found to import for VPC ${VPC_ID}."
              fi
            else
              echo "Could not determine VPC ID, skipping Flow Log import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_iam_role.ec2_test_instance\[0\]$'; then
            echo "EC2 instance IAM role already exists in state."
          else
            if aws iam get-role --role-name "${INSTANCE_ROLE_NAME}" >/dev/null 2>&1; then
              terraform import 'aws_iam_role.ec2_test_instance[0]' "${INSTANCE_ROLE_NAME}"
            else
              echo "No existing EC2 instance IAM role found to import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_iam_instance_profile.ec2_test_instance\[0\]$'; then
            echo "EC2 instance profile already exists in state."
          else
            if aws iam get-instance-profile --instance-profile-name "${INSTANCE_PROFILE_NAME}" >/dev/null 2>&1; then
              terraform import 'aws_iam_instance_profile.ec2_test_instance[0]' "${INSTANCE_PROFILE_NAME}"
            else
              echo "No existing EC2 instance profile found to import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_vpc.ec2_test\[0\]$'; then
            echo "VPC already exists in state."
            VPC_ID=$(terraform state show 'aws_vpc.ec2_test[0]' | awk '/^id\s+=/{print $3}')
          else
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=tag:Name,Values=${VPC_TAG_NAME}" "Name=tag:Environment,Values=dev" "Name=tag:Project,Values=cicd-learning" \
              --query 'Vpcs[0].VpcId' --output text)
            if [ -n "${VPC_ID}" ] && [ "${VPC_ID}" != "None" ]; then
              terraform import 'aws_vpc.ec2_test[0]' "${VPC_ID}"
            else
              echo "No existing VPC found to import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_subnet.ec2_test\[0\]$'; then
            echo "Subnet already exists in state."
          else
            SUBNET_ID=$(aws ec2 describe-subnets \
              --filters "Name=tag:Name,Values=${SUBNET_TAG_NAME}" "Name=tag:Environment,Values=dev" "Name=tag:Project,Values=cicd-learning" \
              --query 'Subnets[0].SubnetId' --output text)
            if [ -n "${SUBNET_ID}" ] && [ "${SUBNET_ID}" != "None" ]; then
              terraform import 'aws_subnet.ec2_test[0]' "${SUBNET_ID}"
            else
              echo "No existing Subnet found to import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_security_group.ec2_test\[0\]$'; then
            echo "Security Group already exists in state."
          else
            SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=${SG_NAME}" \
              --query 'SecurityGroups[0].GroupId' --output text)
            if [ -n "${SG_ID}" ] && [ "${SG_ID}" != "None" ]; then
              terraform import 'aws_security_group.ec2_test[0]' "${SG_ID}"
            else
              echo "No existing Security Group found to import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_instance.destroy_test\[0\]$'; then
            echo "EC2 instance already exists in state."
          else
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=${INSTANCE_TAG_NAME}" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query 'Reservations[0].Instances[0].InstanceId' --output text)
            if [ -n "${INSTANCE_ID}" ] && [ "${INSTANCE_ID}" != "None" ]; then
              terraform import 'aws_instance.destroy_test[0]' "${INSTANCE_ID}"
            else
              echo "No existing EC2 instance found to import."
            fi
          fi

          if terraform state list 2>/dev/null | grep -q '^aws_network_interface.ec2_test_primary\[0\]$'; then
            echo "Network interface already exists in state."
          else
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=${INSTANCE_TAG_NAME}" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query 'Reservations[0].Instances[0].InstanceId' --output text)
            if [ -n "${INSTANCE_ID}" ] && [ "${INSTANCE_ID}" != "None" ]; then
              ENI_ID=$(aws ec2 describe-instances \
                --instance-ids "${INSTANCE_ID}" \
                --query 'Reservations[0].Instances[0].NetworkInterfaces[0].NetworkInterfaceId' --output text)
              if [ -n "${ENI_ID}" ] && [ "${ENI_ID}" != "None" ]; then
                terraform import 'aws_network_interface.ec2_test_primary[0]' "${ENI_ID}"
              else
                echo "No network interface found for the EC2 instance."
              fi
            else
              echo "No existing EC2 instance found, skipping network interface import."
            fi
          fi
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Plan (Dev)
        run: |
          set +e
          terraform plan -no-color -input=false -detailed-exitcode -out=tfplan-dev -var="environment=dev" -var="create_bucket=false" -var="create_ec2_test=true"
          PLAN_EXIT_CODE=$?
          set -e

          if [ "$PLAN_EXIT_CODE" -eq 0 ]; then
            echo "No Terraform changes detected in dev."
          elif [ "$PLAN_EXIT_CODE" -eq 2 ]; then
            echo "Terraform changes detected in dev. Checking for destructive actions..."
            terraform show -json tfplan-dev > tfplan-dev.json
            DESTRUCTIVE_COUNT=$(jq '[.resource_changes[]? | select(any(.change.actions[]; . == "delete"))] | length' tfplan-dev.json)

            if [ "$DESTRUCTIVE_COUNT" -gt 0 ]; then
              echo "Destructive Terraform changes detected in dev. Failing CD."
              jq -r '.resource_changes[]? | select(any(.change.actions[]; . == "delete")) | "- \(.address): \(.change.actions | join(","))"' tfplan-dev.json
              exit 1
            fi

            echo "Only non-destructive changes detected in dev."
          else
            echo "Terraform plan failed in dev."
            exit "$PLAN_EXIT_CODE"
          fi
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Apply (Dev)
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="cicd-learning-sample-app-dev-${ACCOUNT_ID}"

          BUCKET_EXISTS=$(aws s3api list-buckets --query "length(Buckets[?Name=='${BUCKET_NAME}'])" --output text)
          if [ "${BUCKET_EXISTS}" = "1" ]; then
            echo "Bucket already exists. Skip bucket creation in Terraform."
            CREATE_BUCKET=false
          else
            echo "Bucket does not exist. Terraform will create it."
            CREATE_BUCKET=true
          fi

          terraform apply -var="environment=dev" -var="create_bucket=${CREATE_BUCKET}" -var="create_ec2_test=true" -auto-approve
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          echo "s3_bucket_name=$S3_BUCKET" >> $GITHUB_OUTPUT
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Ensure Bucket Tags (Dev)
        run: |
          aws s3api put-bucket-tagging \
            --bucket "${{ steps.tf-outputs.outputs.s3_bucket_name }}" \
            --tagging 'TagSet=[{Key=Name,Value=sample-app-bucket},{Key=Environment,Value=dev},{Key=Project,Value=cicd-learning}]'
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Health Check
        run: |
          python scripts/health_check.py
        working-directory: projects/17-cicd-pippeline
        env:
          S3_BUCKET_NAME: ${{ steps.tf-outputs.outputs.s3_bucket_name }}
        if: ${{ vars.AWS_ROLE_ARN != '' }}
