name: CD

# 実行トリガー: main へのpush（対象パスのみ）または手動実行
on:
  push:
    branches:
      - main
    paths:
      - "projects/17-cicd-pippeline/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

# OIDC で AWS に接続するための最小権限
permissions:
  contents: read
  id-token: write

# Terraform コマンドの既定実行ディレクトリ
defaults:
  run:
    working-directory: projects/17-cicd-pippeline/terraform

jobs:
  # dev 環境デプロイ
  deploy-dev:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: projects/17-cicd-pippeline

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Init (Dev)
        run: terraform init
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Validate
        run: terraform validate
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Set Terraform Exempt Principals (Dev)
        run: |
          ROLE_ARN="${{ vars.AWS_ROLE_ARN }}"
          ACCOUNT_ID=$(echo "$ROLE_ARN" | cut -d: -f5)
          ROLE_NAME="${ROLE_ARN##*/}"
          ASSUMED_ROLE_ARN="arn:aws:sts::${ACCOUNT_ID}:assumed-role/${ROLE_NAME}/*"
          echo "TF_VAR_ip_restriction_exempt_principal_arns=[\"${ROLE_ARN}\",\"${ASSUMED_ROLE_ARN}\"]" >> "$GITHUB_ENV"
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Import Existing Bucket For Destroy Simulation (Dev)
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="cicd-learning-sample-app-dev-${ACCOUNT_ID}"

          BUCKET_EXISTS=$(aws s3api list-buckets --query "length(Buckets[?Name=='${BUCKET_NAME}'])" --output text)
          if [ "${BUCKET_EXISTS}" = "1" ]; then
            echo "Import existing bucket into temporary state for destroy simulation: ${BUCKET_NAME}"
            terraform import -input=false -no-color -var="environment=dev" -var="create_bucket=true" 'aws_s3_bucket.app_bucket[0]' "${BUCKET_NAME}"
          else
            echo "Bucket ${BUCKET_NAME} does not exist. Destroy simulation cannot be performed."
            exit 1
          fi
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Plan (Dev)
        run: |
          set +e
          terraform plan -no-color -input=false -detailed-exitcode -out=tfplan-dev -var="environment=dev" -var="create_bucket=false"
          PLAN_EXIT_CODE=$?
          set -e

          if [ "$PLAN_EXIT_CODE" -eq 0 ]; then
            echo "No Terraform changes detected in dev."
          elif [ "$PLAN_EXIT_CODE" -eq 2 ]; then
            echo "Terraform changes detected in dev. Checking for destructive actions..."
            terraform show -json tfplan-dev > tfplan-dev.json
            DESTRUCTIVE_COUNT=$(jq '[.resource_changes[]? | select(any(.change.actions[]; . == "delete"))] | length' tfplan-dev.json)

            if [ "$DESTRUCTIVE_COUNT" -gt 0 ]; then
              echo "Destructive Terraform changes detected in dev. Failing CD."
              jq -r '.resource_changes[]? | select(any(.change.actions[]; . == "delete")) | "- \(.address): \(.change.actions | join(","))"' tfplan-dev.json
              exit 1
            fi

            echo "Only non-destructive changes detected in dev."
          else
            echo "Terraform plan failed in dev."
            exit "$PLAN_EXIT_CODE"
          fi
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Terraform Apply (Dev)
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="cicd-learning-sample-app-dev-${ACCOUNT_ID}"

          BUCKET_EXISTS=$(aws s3api list-buckets --query "length(Buckets[?Name=='${BUCKET_NAME}'])" --output text)
          if [ "${BUCKET_EXISTS}" = "1" ]; then
            echo "Bucket already exists. Skip bucket creation in Terraform."
            CREATE_BUCKET=false
          else
            echo "Bucket does not exist. Terraform will create it."
            CREATE_BUCKET=true
          fi

          terraform apply -var="environment=dev" -var="create_bucket=${CREATE_BUCKET}" -auto-approve
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Get Terraform Outputs
        id: tf-outputs
        run: |
          S3_BUCKET=$(terraform output -raw s3_bucket_name)
          echo "s3_bucket_name=$S3_BUCKET" >> $GITHUB_OUTPUT
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Ensure Bucket Tags (Dev)
        run: |
          aws s3api put-bucket-tagging \
            --bucket "${{ steps.tf-outputs.outputs.s3_bucket_name }}" \
            --tagging 'TagSet=[{Key=Name,Value=sample-app-bucket},{Key=Environment,Value=dev},{Key=Project,Value=cicd-learning}]'
        if: ${{ vars.AWS_ROLE_ARN != '' }}

      - name: Health Check
        run: |
          python scripts/health_check.py
        working-directory: projects/17-cicd-pippeline
        env:
          S3_BUCKET_NAME: ${{ steps.tf-outputs.outputs.s3_bucket_name }}
        if: ${{ vars.AWS_ROLE_ARN != '' }}

  # stg 環境デプロイ
